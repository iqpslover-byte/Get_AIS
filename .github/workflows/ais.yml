name: Collect AIS

on:
  schedule:
    - cron: "*/20 * * * *"   # 20分ごと(必要なら変更)
  workflow_dispatch:          # 手動実行も可

permissions:
  contents: write

concurrency:
  group: collect-ais
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect AIS
        env:
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
          AIS_COLLECT_SECONDS: "90"
        run: python fetch_ais.py

      - name: Commit vessels.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vessels.json
          git diff --quiet --cached || git commit -m "update vessels.json [skip ci]"
          git push
